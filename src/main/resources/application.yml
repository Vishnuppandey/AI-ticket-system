server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/ticketdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: localhost
      port: 6379

gemini:
  api:
    key: ${GEMINI_API_KEY}
    model: gemini-flash-lite-latest

logging:
  level:
    com.vishnu.ticketsystem: INFO
